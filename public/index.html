
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Google Drive Media Downloader</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Google Drive Media Downloader</h1>
    <p>Unduh foto dan video dari Google Drive dengan mudah.</p>

    <section class="download-box">
      <label for="folderLink">Link Folder Google Drive</label>
      <input
        type="url"
        id="folderLink"
        placeholder="Tempel link Google Drive di sini"
      >

      <button id="connectButton">Hubungkan Google Drive</button>
    </section>

    <p id="status">Aplikasi siap digunakan.</p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
